name: Regenerate security lockfile

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched resolution
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/brace-expansion']?.version;
          if (version !== '1.1.18') {
            throw new Error(`Expected brace-expansion 1.1.18, got ${version ?? 'missing'}`);
          }
          NODE

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for security override"
          git push origin HEAD
