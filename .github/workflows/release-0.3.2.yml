name: Release 0.3.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-0.3.2.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: release-0.3.2
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove stale 0.3.3 tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.3.3 >/dev/null 2>&1; then
            git push origin :refs/tags/v0.3.3
          else
            echo "v0.3.3 tag is already absent."
          fi

      - name: Prepare 0.3.2 release notes
        shell: bash
        run: |
          awk '
            /^## 0\.3\.2$/ { capture=1; next }
            /^## 0\.3\.1$/ { capture=0 }
            capture
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "Could not extract the 0.3.2 changelog section."
            exit 1
          fi

      - name: Create 0.3.2 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.3.2
          --repo "${{ github.repository }}"
          --target 64c1abae03b0ce2dc25c4f5d31e1446420ee75bc
          --title "v0.3.2"
          --notes-file release-notes.md

      - name: Dispatch npm publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run npm-publish.yml
          --repo "${{ github.repository }}"
          -f tag=v0.3.2
